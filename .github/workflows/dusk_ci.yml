on:
  pull_request:
  push:
    branches: master

name: Continuous integration

jobs:
  code-quality:
    name: Code quality
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: cq

  dusk_analyzer:
    name: Dusk Analyzer
    uses: dusk-network/.github/.github/workflows/dusk-analysis.yml@main

  build-benches:
    name: Build benchmarks
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: build-benches

  run-examples:
    name: Run examples
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: run-examples

  doc:
    name: Build documentation
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: doc

  doc-internal:
    name: Build internal documentation
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: doc-internal

  no-std:
    name: Run no-std checks
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: no-std

  test:
    name: Run tests
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: test

  test-32:
    name: Run tests on 32-bit
    uses: dusk-network/.github/.github/workflows/run-make.yml@main
    with:
      make_target: test-32
      runner: ubuntu-22.04

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt install -y kcov
      - run: RUSTFLAGS='-Cdebuginfo=2 -Cllvm-args=--inline-threshold=0 -Clink-dead-code' cargo test --release --no-run --all-features
      - name: Collect coverage
        run: >
          find target/release/deps -type f -executable ! -name "*.*" |
          xargs -n1 kcov --exclude-pattern=/.cargo,/usr/lib --verify target/cov
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  cargo_deny:
    name: Cargo Deny
    uses: dusk-network/.github/.github/workflows/cargo-deny.yml@f6d992d53d414c1b224d4fd5a8e8f9d40017115e
    with:
      runner: ubuntu-22.04
      rust-toolchain: "1.96.1"
      cargo-deny-version: "0.20.2"
      enable_sccache: false
